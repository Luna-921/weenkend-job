<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周末有活 · 校园兼职撮合</title><style>
:root{--ink:#18342c;--muted:#73847c;--green:#207a59;--lime:#e4f4d9;--bg:#f6f8f4;--line:#e3eae3;--orange:#fff0d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:15px}.brand{font-weight:900;font-size:23px;letter-spacing:-1px}.brand span{color:var(--green)}.switch{display:flex;background:#edf3ec;border-radius:100px;padding:4px}.switch button{border:0;background:transparent;border-radius:50px;padding:9px 17px;color:#63746b}.switch button.active{background:var(--ink);color:#fff}.container{max-width:1120px;margin:0 auto;padding:30px 24px 70px}.hero{background:#173d30;border-radius:25px;color:#fff;padding:36px 40px;display:flex;justify-content:space-between;gap:20px;align-items:center;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:2px;color:#b8dfc5;font-weight:800}.hero h1{font-size:clamp(29px,4vw,45px);margin:12px 0;line-height:1.25}.hero p{color:#d1e4d8;line-height:1.8;margin:0}.heroicon{font-size:90px;transform:rotate(-12deg)}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:32px 0 16px}.sectionhead h2{margin:0;font-size:23px}.sectionhead small{color:var(--muted)}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel,.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px}.panel h3{margin:0 0 20px}.field{margin:0 0 19px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9e4db;border-radius:11px;background:#fff;color:var(--ink)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dbe7db;background:#fff;padding:9px 12px;border-radius:50px;color:#51675a;font-size:13px}.chip.on{background:#dff1e2;border-color:#79b995;color:#166d4c;font-weight:700}.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:#fff;font-weight:750}.btn.secondary{background:#edf4ee;color:var(--green)}.btn.dark{background:var(--ink)}.btn:disabled{background:#d3dad5;color:#7d8980;cursor:not-allowed}.stack{display:grid;gap:13px}.jobtop{display:flex;justify-content:space-between;gap:12px}.jobtitle{font-weight:850;font-size:19px;margin:0 0 10px}.salary{color:#e08039;font-size:20px;font-weight:850;white-space:nowrap}.meta{color:#65796d;font-size:13px;line-height:2}.badge{display:inline-block;background:#edf7e8;color:#297a51;border-radius:7px;padding:4px 8px;font-size:12px;margin-right:7px}.badge.warn{background:var(--orange);color:#a86b27}.jobfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px;margin-top:15px;gap:10px}.reason{color:#43775a;font-size:13px}.empty{text-align:center;padding:65px 20px;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button{border:0;background:#e9f0e9;border-radius:10px;padding:10px 15px;color:#64766b}.tabs button.active{background:var(--ink);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:20px;background:white;border:1px solid var(--line);border-radius:17px}.stat strong{font-size:29px;display:block;margin:5px 0}.stat small{color:var(--muted)}.notice{background:#eef6e8;border:1px solid #d8ead6;padding:15px 19px;border-radius:14px;color:#3f7456;font-size:13px;line-height:1.7;margin:18px 0}.modalback{position:fixed;inset:0;background:#10291fb3;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal{background:white;border-radius:22px;width:min(520px,100%);padding:26px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px}.close{float:right;background:#eef2ee;border:0;border-radius:50%;width:32px;height:32px}.hidden{display:none!important}.small{font-size:13px;color:var(--muted);line-height:1.8}.footer{text-align:center;color:#8a9990;font-size:12px;margin-top:40px}.link{border:0;background:none;color:var(--green);font-weight:750;padding:0}.pill{border-radius:50px;padding:6px 10px;background:#edf4ee;font-size:12px;color:var(--green)}@media(max-width:720px){.container{padding:16px 14px 55px}.top{padding:12px 14px}.brand{font-size:19px}.switch button{padding:8px 12px}.hero{padding:27px 23px}.heroicon{display:none}.layout{grid-template-columns:1fr}.panel,.card{padding:18px}.statgrid{grid-template-columns:repeat(3,1fr)}.stat{padding:13px}.stat strong{font-size:24px}.jobfoot{align-items:flex-start}.sectionhead h2{font-size:20px}}
</style></head><body><header><div class="top"><div class="brand">🌿 周末<span>有活</span></div><div class="switch"><button id="studentSwitch" class="active" onclick="setRole('student')">🎒 学生端</button><button id="merchantSwitch" onclick="setRole('merchant')">🏪 商家端</button></div></div></header><main class="container"><section class="hero"><div><div class="eyebrow">WEEKEND · CAMPUS · WORK</div><h1 id="heroTitle">周末有空，<br>刚好有好工作。</h1><p id="heroDesc">先选空闲时间，再找附近兼职。<br>少一点无效投递，多一点确定的收入。</p></div><div class="heroicon">🧋</div></section><div id="studentView"><div class="sectionhead"><h2>为你找到合适的周末兼职</h2><small>根据时间 · 距离 · 薪资筛选</small></div><div class="layout"><aside class="panel"><h3>🎯 我的兼职偏好</h3><div class="field"><label>有空的时间（可多选）</label><div class="chips" id="timeChips"></div></div><div class="field"><label>最远距离</label><select id="distance" onchange="renderJobs()"><option value="3">3 公里内</option><option value="5" selected>5 公里内</option><option value="10">10 公里内</option></select></div><div class="field"><label>最低时薪</label><select id="pay" onchange="renderJobs()"><option value="0">不限</option><option value="20">20 元/小时</option><option value="25" selected>25 元/小时</option><option value="30">30 元/小时</option></select></div><div class="field"><label>岗位类别</label><select id="category" onchange="renderJobs()"><option value="全部">全部类型</option><option>餐饮</option><option>零售</option><option>活动</option><option>教育</option></select></div><div class="notice">💡 <b>为什么先选时间？</b><br>周末兼职最大的阻碍是时间错配。我们先排除无法到岗的职位，再展示适合你的机会。</div><button class="btn secondary" style="width:100%" onclick="resetFilters()">重置筛选</button></aside><div><div class="tabs"><button class="active" id="jobsTab" onclick="studentTab('jobs')">发现兼职</button><button id="applicationsTab" onclick="studentTab('applications')">我的报名 <span id="appCount"></span></button></div><div id="jobsPane" class="stack"></div><div id="applicationsPane" class="stack hidden"></div></div></div></div><div id="merchantView" class="hidden"><div class="sectionhead"><h2>商家工作台</h2><button class="btn" onclick="showPost()">＋ 发布新岗位</button></div><div class="statgrid"><div class="stat"><small>招聘中岗位</small><strong id="openCount">0</strong></div><div class="stat"><small>待处理报名</small><strong id="pendingCount">0</strong></div><div class="stat"><small>已确认录用</small><strong id="acceptedCount">0</strong></div></div><div class="notice">🔁 <b>招聘进度实时同步</b><br>学生报名后可在这里审核，录用结果将同步至学生端。</div><div class="tabs"><button class="active" id="mJobsTab" onclick="merchantTab('jobs')">我的岗位</button><button id="mApplicantsTab" onclick="merchantTab('applicants')">报名审核</button></div><div id="merchantJobs" class="stack"></div><div id="merchantApplicants" class="stack hidden"></div></div><div class="footer">周末有活 · 让每个周末都有好机会 ｜ 当前岗位为示例信息，请勿用于真实求职</div></main><div class="modalback hidden" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const defaults=[{id:1,title:'周末奶茶店店员',merchant:'青柠茶铺 · 大学城店',category:'餐饮',time:'周六下午',start:'14:00',end:'20:00',distance:1.2,pay:25,slots:2,desc:'协助点单、饮品打包与门店清洁。有人带教，无经验可报名。'},{id:2,title:'周日市集活动协助',merchant:'好日子活动工作室',category:'活动',time:'周日下午',start:'13:00',end:'19:00',distance:2.5,pay:30,slots:3,desc:'协助签到、摊位引导及物料整理，需沟通积极。'},{id:3,title:'书店周末理货',merchant:'拾页书店',category:'零售',time:'周六上午',start:'09:00',end:'13:00',distance:0.8,pay:25,slots:1,desc:'图书整理、上架和顾客引导，工作环境安静。'},{id:4,title:'少儿英语课堂助教',merchant:'星桥成长中心',category:'教育',time:'周日上午',start:'09:00',end:'12:00',distance:4.2,pay:35,slots:2,desc:'协助老师组织课堂活动，英语表达流利者优先。'},{id:5,title:'商场品牌快闪协助',merchant:'晴空品牌策划',category:'活动',time:'周六下午',start:'13:00',end:'19:00',distance:6.5,pay:32,slots:4,desc:'快闪活动签到与礼品发放，需按时到场。'}];
const times=['周六上午','周六下午','周日上午','周日下午'];let selected=['周六下午','周日下午'];let role='student';let sTab='jobs';let mTab='jobs';let jobs=load('weekend_jobs',defaults);let applications=load('weekend_apps',[]);function load(k,f){try{return JSON.parse(localStorage.getItem(k))||structuredClone(f)}catch(e){return JSON.parse(JSON.stringify(f))}}function save(){localStorage.setItem('weekend_jobs',JSON.stringify(jobs));localStorage.setItem('weekend_apps',JSON.stringify(applications))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setRole(r){role=r;document.getElementById('studentView').classList.toggle('hidden',r!=='student');document.getElementById('merchantView').classList.toggle('hidden',r!=='merchant');document.getElementById('studentSwitch').classList.toggle('active',r==='student');document.getElementById('merchantSwitch').classList.toggle('active',r==='merchant');document.getElementById('heroTitle').innerHTML=r==='student'?'周末有空，<br>刚好有好工作。':'周末缺人，<br>好帮手就在附近。';document.getElementById('heroDesc').innerHTML=r==='student'?'先选空闲时间，再找附近兼职。<br>少一点无效投递，多一点确定的收入。':'发布岗位、审核报名、确认录用。<br>把短期招聘变得简单可靠。';renderAll()}function renderChips(){document.getElementById('timeChips').innerHTML=times.map(t=>`<button class="chip ${selected.includes(t)?'on':''}" onclick="toggleTime('${t}')">${t}</button>`).join('')}function toggleTime(t){selected=selected.includes(t)?selected.filter(x=>x!==t):[...selected,t];renderChips();renderJobs()}function resetFilters(){selected=['周六下午','周日下午'];document.getElementById('distance').value='5';document.getElementById('pay').value='25';document.getElementById('category').value='全部';renderChips();renderJobs()}function remaining(j){return Math.max(0,j.slots-applications.filter(a=>a.jobId===j.id&&['已录用','待到岗','已完成'].includes(a.status)).length)}function match(j){return Math.max(0,Math.round(100-(j.distance*3)-(Math.max(0,30-j.pay)*1.5)))}function renderJobs(){let dist=+document.getElementById('distance').value,pay=+document.getElementById('pay').value,cat=document.getElementById('category').value;let filtered=jobs.filter(j=>selected.includes(j.time)&&j.distance<=dist&&j.pay>=pay&&(cat==='全部'||j.category===cat)&&remaining(j)>0).sort((a,b)=>match(b)-match(a));document.getElementById('jobsPane').innerHTML=filtered.length?filtered.map(j=>`<article class="card"><div class="jobtop"><div><h3 class="jobtitle">${esc(j.title)}</h3><span class="badge">🏪 校园周边商家</span><span class="badge warn">剩余 ${remaining(j)} 人</span></div><div class="salary">¥${j.pay}<small style="font-size:12px">/时</small></div></div><div class="meta">🏪 ${esc(j.merchant)}<br>🕒 ${j.time} ${j.start}–${j.end}　📍 ${j.distance}km · ${esc(j.category)}</div><div class="jobfoot"><div class="reason">✓ 时间吻合 · 距离合适 · 薪资达标</div><button class="btn" onclick="showJob(${j.id})">查看 / 报名 →</button></div></article>`).join(''):'<div class="card empty">暂时没有符合条件的岗位 🌱<br><br>试试放宽时间、距离或薪资条件。</div>'}function showJob(id){let j=jobs.find(x=>x.id===id);let exists=applications.find(a=>a.jobId===id);showModal(`<h2>${esc(j.title)}</h2><p class="small">${esc(j.merchant)} · 校园周边商家</p><div class="notice">🕒 ${j.time} ${j.start}–${j.end}<br>📍 距离学校 ${j.distance}km<br>💰 ¥${j.pay}/小时 · 约 ¥${j.pay*(+j.end.slice(0,2)-(+j.start.slice(0,2)))}/班<br>👥 剩余名额 ${remaining(j)} 人</div><h3>工作内容</h3><p class="small">${esc(j.desc)}</p><h3>为什么推荐？</h3><p class="small">符合你设置的空闲时间、距离和最低薪资条件，避免无效报名。</p><p class="small">温馨提示：当前展示的是示例岗位，请勿用于真实求职。</p><button class="btn" style="width:100%" ${exists||remaining(j)===0?'disabled':''} onclick="apply(${id})">${exists?'已报名 · 查看我的报名':remaining(j)===0?'名额已满':'一键报名'}</button>`)}function apply(id){if(applications.some(a=>a.jobId===id)){closeModal();studentTab('applications');return}applications.push({id:Date.now(),jobId:id,status:'待审核',created:new Date().toLocaleString('zh-CN')});save();closeModal();studentTab('applications');renderAll();toast('报名成功！商家将审核你的申请。')}function studentTab(t){sTab=t;document.getElementById('jobsTab').classList.toggle('active',t==='jobs');document.getElementById('applicationsTab').classList.toggle('active',t==='applications');document.getElementById('jobsPane').classList.toggle('hidden',t!=='jobs');document.getElementById('applicationsPane').classList.toggle('hidden',t!=='applications');renderApplications()}function renderApplications(){document.getElementById('appCount').textContent=applications.length?'('+applications.length+')':'';document.getElementById('applicationsPane').innerHTML=applications.length?applications.slice().reverse().map(a=>{let j=jobs.find(x=>x.id===a.jobId);if(!j)return '';return `<div class="card"><div class="row"><h3 style="margin:0">${esc(j.title)}</h3><span class="pill">${a.status}</span></div><p class="small">${esc(j.merchant)} · ${j.time} ${j.start}–${j.end}<br>报名时间：${a.created}</p><div class="row"><span class="small">${a.status==='待审核'?'等待商家审核':a.status==='已录用'?'商家已录用，请确认是否接单':a.status==='待到岗'?'双方已确认，等待到岗':a.status==='已完成'?'兼职已完成':a.status==='已拒绝'?'商家未录用本次申请':'已取消'}</span><div>${a.status==='已录用'?`<button class="btn" onclick="changeApp(${a.id},'待到岗')">确认接单</button> <button class="btn secondary" onclick="changeApp(${a.id},'已取消')">婉拒</button>`:''}${a.status==='待到岗'?`<button class="btn" onclick="changeApp(${a.id},'已完成')">确认兼职完成</button>`:''}${a.status==='待审核'?`<button class="btn secondary" onclick="changeApp(${a.id},'已取消')">撤回报名</button>`:''}</div></div></div>`}).join(''):'<div class="card empty">还没有报名记录。<br>去发现兼职，开始你的第一份周末工作吧。</div>'}function changeApp(id,status){let a=applications.find(x=>x.id===id);if(a){a.status=status;save();renderAll()}}function merchantTab(t){mTab=t;document.getElementById('mJobsTab').classList.toggle('active',t==='jobs');document.getElementById('mApplicantsTab').classList.toggle('active',t==='applicants');document.getElementById('merchantJobs').classList.toggle('hidden',t!=='jobs');document.getElementById('merchantApplicants').classList.toggle('hidden',t!=='applicants');renderMerchant()}function renderMerchant(){document.getElementById('openCount').textContent=jobs.filter(j=>remaining(j)>0).length;document.getElementById('pendingCount').textContent=applications.filter(a=>a.status==='待审核').length;document.getElementById('acceptedCount').textContent=applications.filter(a=>['已录用','待到岗','已完成'].includes(a.status)).length;document.getElementById('merchantJobs').innerHTML=jobs.map(j=>`<div class="card"><div class="row"><div><h3 style="margin:0 0 8px">${esc(j.title)}</h3><span class="small">${j.time} ${j.start}–${j.end} · ¥${j.pay}/小时 · ${j.distance}km</span></div><span class="pill">${remaining(j)>0?'招聘中':'已招满'}</span></div><div class="jobfoot"><span class="small">计划招聘 ${j.slots} 人 · 剩余 ${remaining(j)} 人 · 收到 ${applications.filter(a=>a.jobId===j.id).length} 份报名</span><button class="btn secondary" onclick="merchantTab('applicants')">查看报名</button></div></div>`).join('');document.getElementById('merchantApplicants').innerHTML=applications.length?applications.slice().reverse().map(a=>{let j=jobs.find(x=>x.id===a.jobId);if(!j)return '';return `<div class="card"><div class="row"><div><h3 style="margin:0 0 8px">${esc(j.title)}</h3><span class="small">申请人：校园学生 · ${a.created}</span></div><span class="pill">${a.status}</span></div><p class="small">✓ 申请人已按岗位时间与距离筛选；建议录用前再次确认到岗意愿。</p><div class="row"><span class="small">${j.time} ${j.start}–${j.end}</span><div>${a.status==='待审核'?`<button class="btn" ${remaining(j)===0?'disabled':''} onclick="changeApp(${a.id},'已录用')">确认录用</button> <button class="btn secondary" onclick="changeApp(${a.id},'已拒绝')">不录用</button>`:''}${a.status==='待到岗'?`<span class="badge">学生已确认接单</span>`:''}</div></div></div>`}).join(''):'<div class="card empty">暂无报名。<br>学生提交报名后，申请会显示在这里。</div>'}function showPost(){showModal(`<h2>发布周末兼职</h2><p class="small">填写岗位信息，发布后即可在学生端查看。</p><form id="postForm" onsubmit="postJob(event)"><div class="field"><label>岗位名称</label><input name="title" required maxlength="40" placeholder="例如：周末咖啡店协助"></div><div class="field"><label>商家名称</label><input name="merchant" required maxlength="40" placeholder="例如：校园咖啡馆"></div><div class="field"><label>兼职时间</label><select name="time">${times.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="row"><div class="field" style="flex:1"><label>开始时间</label><input name="start" type="time" value="14:00" required></div><div class="field" style="flex:1"><label>结束时间</label><input name="end" type="time" value="18:00" required></div></div><div class="row"><div class="field" style="flex:1"><label>时薪（元）</label><input name="pay" type="number" min="1" max="1000" value="28" required></div><div class="field" style="flex:1"><label>距离学校（km）</label><input name="distance" type="number" min="0" max="100" step="0.1" value="1.5" required></div></div><div class="row"><div class="field" style="flex:1"><label>招聘人数</label><input name="slots" type="number" min="1" max="100" value="2" required></div><div class="field" style="flex:1"><label>岗位类型</label><select name="category"><option>餐饮</option><option>零售</option><option>活动</option><option>教育</option></select></div></div><div class="field"><label>工作内容</label><input name="desc" required maxlength="160" placeholder="说明工作内容和要求"></div><button class="btn" style="width:100%">发布岗位</button></form>`)}function postJob(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.end<=d.start){alert('结束时间必须晚于开始时间');return}jobs.unshift({id:Date.now(),title:d.title,merchant:d.merchant,time:d.time,start:d.start,end:d.end,pay:+d.pay,distance:+d.distance,slots:+d.slots,category:d.category,desc:d.desc});save();closeModal();renderAll();toast('岗位已发布！切换学生端可查看。')}function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBack').classList.remove('hidden')}function closeModal(){document.getElementById('modalBack').classList.add('hidden')}function toast(msg){showModal(`<h2>✅ 操作成功</h2><p class="small">${esc(msg)}</p><button class="btn" onclick="closeModal()">知道了</button>`)}function renderAll(){renderChips();renderJobs();renderApplications();renderMerchant()}renderAll();
</script></body></html>
